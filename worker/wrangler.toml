# Jita Ledger's cloud Worker. The app itself stays on GitHub Pages; this holds the ledger in D1.
name = "jita-ledger-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-20"

[vars]
EVE_CLIENT_ID = "7acf615bd9f343be9511e10c1f8ecc82"
ALLOWED_ORIGINS = "https://magicfishgit.github.io,http://localhost:5173"
APP_URL = "https://magicfishgit.github.io/jita-ledger/"

[[d1_databases]]
binding = "DB"
database_name = "jita-ledger"
database_id = "39bbd652-0717-417f-b6a4-ffbaeffb539a"
migrations_dir = "migrations"

[observability]
enabled = true

# Background jobs: the market watch every five minutes, the archive hourly at seven past.
[triggers]
crons = ["*/5 * * * *", "7 * * * *"]

# Requests and the hourly archive may use up to 2 minutes of CPU. The five-minute round can't: Cloudflare gives
# crons more frequent than hourly 30 s regardless. It uses about 0.2 s for ~130 items, so 400 is ~1 s.
[limits]
cpu_ms = 120000
